# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# set timeout for slow operations because slow prompts severely and negatively impacts my productivity
scan_timeout = 25
command_timeout = 75

# Inserts a blank line between shell prompts
add_newline = true
# format = "$fill$time$os$shell$direnv$line_break$all$jobs$hostname$status$character"
# right_format = "$time$os$shell$direnv$line_break"

# after $directory\
# $vcsh\
# $fossil_branch\
# $fossil_metrics\
# $git_branch\
# $git_commit\
# $git_state\
# $git_metrics\
# $git_status\
# $hg_branch\
# $hg_state\
# $pijul_channel\
# before $docker_context\
# copied the entire thing just to insert between a line_break
