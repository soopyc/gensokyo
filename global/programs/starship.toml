$time\
$container\
$netns\
$line_break\
$jobs\
$hostname\
$status\
$character"""
right_format = "$battery$os$shell$direnv"

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[\$](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'
error_symbol = '[\$](bold red)'

[os]
disabled = false
style = "bold blue"
format = " on [$symbol($name)]($style)"

[battery]
format = '[$symbol$percentage]($style)'

[[battery.display]]
threshold = 100
style = "bold green"

[[battery.display]]
threshold = 75
style = "bold yellow"

[[battery.display]]
threshold = 30
style = "bold red"

[username]
show_always = true
format = '[$user]($style) '

[status]
disabled = false
format = '[$symbol $status]($style) '
symbol = '✗'
map_symbol = true
pipestatus = true

sigint_symbol = ''
not_executable_symbol = ""
not_found_symbol = ''
signal_symbol = ''

[shell]
disabled = false
format = ' with [󰆍 $indicator]($style)'
style = 'bold green'

[nix_shell]
symbol = " "
format = 'via [$symbol($name$state)]($style) '
impure_msg = ''
pure_msg = '+pure'
unknown_msg = '+?'
heuristic = true

[fill]
symbol = ' '

[hostname]
ssh_symbol = "󰒍 "
ssh_only = false
format = '[@](purple)[$ssh_symbol$hostname](bold purple) '

[time]
disabled = false
format = "on [$time]($style) "
time_format = "%a %b %d %T"

[jobs]
number_threshold = 1
symbol = "+"
style = "blue"

[cmd_duration]
min_time = 0
show_milliseconds = true

[direnv]
disabled = false
style = "bold cyan"
format = " with [$symbol$allowed]($style)"
allowed_msg = "" # loaded and accepted by user
not_allowed_msg = "" # loaded, user never allowed/denied
denied_msg = "" # loaded, user explicitly denied

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 󰌾"
format = 'in [$read_only]($read_only_style)[$path]($style) '

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "

[golang]
